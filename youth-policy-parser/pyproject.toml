[project]
name = "youth-policy-parser"
version = "0.1.0"
description = "청년정책 자격요건을 조건식(DSL)으로 바꿔 판정하고 탈락 사유를 설명하는 서비스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "streamlit>=1.50",  # 버튼 width="stretch" 사용
    "lark>=1.2",
    "pulp>=3.3,<4",  # 4.0부터 내장 CBC 솔버가 빠짐 → 3.x 고정 (실패 시 전수 탐색으로 대체)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# PuLP 4.0 이전 예고 경고만 숨긴다 (우리 코드의 경고는 그대로 보임)
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, UP: 최신 문법, B: 흔한 버그 패턴
select = ["E", "F", "I", "UP", "B"]
