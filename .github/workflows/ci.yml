# main에 들어가는 모든 변경을 자동으로 검사한다.
# PR 화면에 ✅/❌로 표시되므로, ❌이면 머지하지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youth-policy-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: uv 설치
        run: pip install uv
      - name: 패키지 설치 (uv.lock 그대로)
        run: uv sync --locked
      - name: 코드 스타일 (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 정책 데이터 검증
        run: uv run python scripts/validate.py
      - name: 테스트
        run: uv run pytest -q
